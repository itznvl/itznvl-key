services:
  - type: web
    name: itznvl-key
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: ADMIN_PASSWORD
        value: itznvl2026
      - key: SECRET_KEY
        generateValue: true
      - key: HMAC_SECRET
        generateValue: true
      - key: KEY_DAYS
        value: "1"